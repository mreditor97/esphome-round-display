# LilyGo T-RGB 2.1" round (full circle) - ESP32-S3, ST7701S 480x480 RGB panel, CST820 touch, XL9535 I/O expander.
#
# Pin numbers are taken from LilyGo's T-RGB repository (src/utilities.h and src/LilyGo_RGBPanel.h):
#   I2C              SDA GPIO8, SCL GPIO48 (shared by the XL9535 at 0x20 and the CST820 at 0x15)
#   Backlight        GPIO46
#   Touch interrupt  GPIO1
#   XL9535 IO1       touch reset
#   XL9535 IO2       panel power enable (must be high)
#   XL9535 IO3/4/5   ST7701S SPI CS / MOSI / SCLK (used only to send the init sequence)
#   XL9535 IO6       ST7701S reset
#   XL9535 IO7       SD card enable
# The RGB data, sync and clock pins come from the mipi_rgb T-RGB-2.1 model.

substitutions:
  name: t-rgb-round-display
  friendly_name: T-RGB Round Display

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  # Encrypted with the API encryption key.
  - platform: esphome
    encryption: {}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}

captive_portal:

i2c:
  id: bus_a
  sda: GPIO8
  scl: GPIO48
  # The panel init sequence is sent by software SPI through the XL9535, so every SPI clock edge is an I2C
  # transfer. A faster bus makes boot noticeably quicker.
  frequency: 400kHz

xl9535:
  - id: expander
    address: 0x20

spi:
  - id: lcd_spi
    interface: software
    clk_pin:
      xl9535: expander
      number: 5
    mosi_pin:
      xl9535: expander
      number: 4

output:
  - platform: ledc
    id: backlight_output
    pin:
      number: GPIO46
      ignore_strapping_warning: true

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_output
    restore_mode: ALWAYS_ON

display:
  - platform: mipi_rgb
    model: T-RGB-2.1
    id: round_display
    spi_id: lcd_spi
    # Replaces the model's default enable pin (GPIO46), which is used for the dimmable backlight above.
    enable_pin:
      xl9535: expander
      number: 2
    reset_pin:
      xl9535: expander
      number: 6
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  # The CST820 is handled by the cst816 driver, which detects it by its chip ID.
  - platform: cst816
    id: round_touch
    display: round_display
    interrupt_pin: GPIO1
    reset_pin:
      xl9535: expander
      number: 1

lvgl:
  displays: round_display
  touchscreens: round_touch
  widgets:
    - label:
        align: TOP_MID
        y: 70
        text: ${friendly_name}
    - arc:
        id: brightness_arc
        align: CENTER
        width: 360
        height: 360
        min_value: 10
        max_value: 100
        value: 100
        on_value:
          - light.turn_on:
              id: backlight
              brightness: !lambda return x / 100.0f;
          - lvgl.label.update:
              id: brightness_label
              text:
                format: "%d%%"
                args: ["(int) x"]
    - label:
        id: brightness_label
        align: CENTER
        text: "100%"
